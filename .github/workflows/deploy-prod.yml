name: Production Deployment

# Triggered when a Release is published (see trigger-release.yml, which tags a commit that
# already passed staging). Deploys exactly that commit's artifact set from the
# staging bucket to production. Rollback = publish a Release for an older staged commit.
on:
  release:
    types: [published]

# Never run two production deployments at once, and never cancel one in flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    # only authorized users can trigger deployment to prod with GitHub environment protection rule
    environment: production

    env:
      AWS_STG_ACCOUNT_ID: "071308038858"
      AWS_PRD_ACCOUNT_ID: "591292939760"

    steps:
      # check out the released tag so the SAM template / scripts match the artifacts
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-just

      # resolve the exact commit the release tag points to
      - name: Resolve release commit SHA
        run: |
          SHA=$(git rev-parse HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "BUILD_PREFIX=s3://apiforge-artifacts-071308038858/builds/$SHA" >> "$GITHUB_ENV"

          echo "Releasing commit $SHA (tag ${{ github.event.release.tag_name }})"

      - name: Configure AWS Production Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_PRD_ACCOUNT_ID }}:role/GitHubActionsDeploymentRole # role name should match the one in bootstrap/template.yml
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # safety net: only commits that passed staging (staged/<sha> exists) may go to prod.
      # release.yml already enforces this, this guards against manually created releases.
      - name: Verify commit passed staging
        run: |
          STG_BUCKET="s3://apiforge-artifacts-$AWS_STG_ACCOUNT_ID"
          echo "Checking staging marker for $SHA ..."
          if ! aws s3 ls "$STG_BUCKET/staged/$SHA" >/dev/null 2>&1; then
            echo "❌ ERROR: Commit $SHA has no staging marker (staged/$SHA missing)."
            echo "Only commits that passed staging + smoke test can be deployed to production."
            exit 1
          fi
          echo "✅ Commit $SHA passed staging."

      - name: Download Backend Artifacts from S3
        run: |
          # bucket is in staging account, prod has read access
          for MODULE in backend-api-lambda sqs-dispatcher-lambda function-deployer-lambda; do
            echo "Downloading $MODULE ($SHA) from STG S3..."
            mkdir -p lambda/$MODULE/target
            aws s3 cp "$BUILD_PREFIX/$MODULE/function.zip" "lambda/$MODULE/target/function.zip"
          done

      # the frontend sync depends on the bucket existing, so it must come after this step.
      - name: Deploy to Production
        run: just deploy-stack prod

      # we read from the staging bucket but deploy to the production bucket
      - name: Deploy Frontend Artifact to Frontend S3 Bucket
        run: |
          PROD_FRONTEND_BUCKET="apiforge-frontend-$AWS_PRD_ACCOUNT_ID"

          aws s3 cp "$BUILD_PREFIX/frontend.zip" ./frontend-local.zip

          echo "Unzipping frontend package..."
          unzip -q frontend-local.zip -d ./frontend-dist

          echo "Synchronizing files with the production web S3 bucket..."
          # CRITICAL: We must use --exclude "config.js" here.
          # config.js is dynamically generated by the `connect-frontend.sh` script during deploy-stack above,
          # so it is missing from our local './frontend-dist' artifact. Without the exclude flag,
          # the `--delete` parameter would wipe out the config.js that connect-frontend.sh just wrote to the bucket, 
          # breaking the app until the next deploy.
          aws s3 sync ./frontend-dist/ "s3://$PROD_FRONTEND_BUCKET/" --delete --exclude "config.js"

      # we need to invalidate the CloudFront cache after deployment to make sure the new frontend version is served, otherwise users might still get the old cached version.
      - name: Invalidate CloudFront CDN Cache
        run: |
          STACK_NAME="apiforge-prod"

          echo "Fetching CloudFront Distribution ID from CloudFormation Outputs..."
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "❌ ERROR: Could not find CloudFrontDistributionId in Stack Outputs"
            exit 1
          fi

          echo "🚀 Triggering cache invalidation for Distribution: $DISTRIBUTION_ID"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "✅ Invalidation submitted successfully. ID: $INVALIDATION_ID"
          echo "Note: It usually takes 1-3 minutes for AWS CloudFront to apply this globally."