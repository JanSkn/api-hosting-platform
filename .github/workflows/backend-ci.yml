name: Backend CI checks

on:
  workflow_call:
    inputs:
      module-name:
        required: true
        type: string

# TODO: github.sha is the commit sha, differnt sha when mergin to main --> deploy yamls wont find the artifact
jobs:
  ci-checks:
    name: CI Checks – ${{ inputs.module-name }}
    runs-on: ubuntu-latest

    # contains SOPS secret
    environment: ci

    permissions:
      id-token: write
      contents: read      

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-maven
      - uses: ./.github/actions/setup-just
      - uses: mdgreenwald/mozilla-sops-action@v1.6.0
        with:
          version: '3.12.1'

      - name: Create Build Artifact
        run: just lambda install ${{ inputs.module-name }}

      - name: Static Code Analysis
        run: |
          just ${{ inputs.module-name }} lint
          just ${{ inputs.module-name }} code-analysis

      - name: Start LocalStack
        # see https://getsops.io/docs/#encrypting-using-age override default lookup
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_SECRET_AGE_KEY }}
        run: just run-localstack

      - name: Deploy Test Stack to LocalStack
        run: just deploy-stack testing

      - name: Run Unit Tests
        run: just ${{ inputs.module-name }} unit-test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.module-name }}
          path: lambda/${{ inputs.module-name }}/target/surefire-reports/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.module-name }}
          path: lambda/${{ inputs.module-name }}/target/site/jacoco/

      - name: Configure AWS Staging Credentials (OIDC) for Code Artifacts
        if: inputs.module-name != 'common-utils'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::071308038858:role/GitHubActionsDeploymentRole # role name should match the one in bootstrap/template.yml
          aws-region: eu-central-1

      # For every changed sub module:
        # Upload immutable artifact versioned by commit SHA.
        # This allows deploying a specific known-good version to prod
        # even after GitHub Actions artifact retention has expired because we do manual deployments after stg. 
      # The manifest.json will be created in update-manifest.yml after the main CI workflow has completed successfully, so we can be sure that only tested artifacts are included in the manifest.
      # The manifest groups the commits together in case a module was not updated.
      # - name: Upload Build Artifact to S3
      #   # common-utils is not a lambda and not needed for deployment, only for compilation of other modules, so we can skip uploading it
