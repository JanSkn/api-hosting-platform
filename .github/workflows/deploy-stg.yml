name: Staging Deployment

on:
  workflow_run:
    workflows: ["Publish Main Artifacts"] # must be the exact name of the workflow in publish-main.yml
    types:
      - completed
    branches:
      - main

# Only ever deploy the newest staging state. If publishes pile up, supersede the
# in-flight staging deploy with the latest (a CloudFormation stack can't update
# concurrently anyway).
concurrency:
  group: deploy-stg
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-just

      - name: Configure AWS Staging Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::071308038858:role/GitHubActionsDeploymentRole # role name should match the one in bootstrap/template.yml
          aws-region: eu-central-1

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Download Backend Artifacts from S3
        # do not include common-utils as it is not a lambda and not needed for deployment, only for compilation of other modules
        run: |
          AWS_STG_ACCOUNT_ID=071308038858
          BUCKET="s3://apiforge-artifacts-$AWS_STG_ACCOUNT_ID"
          MANIFEST_SOURCE="manifests/latest/manifest.json"

          aws s3 cp "$BUCKET/$MANIFEST_SOURCE" ./manifest.json

          for MODULE in backend-api-lambda sqs-dispatcher-lambda function-deployer-lambda; do
            MODULE_SHA=$(jq -r ".modules.\"$MODULE\"" ./manifest.json)

            if [ -z "$MODULE_SHA" ] || [ "$MODULE_SHA" = "null" ]; then
              echo "❌ ERROR: No artifact version for $MODULE in manifest (never built?). Aborting."
              exit 1
            fi

            echo "Downloading $MODULE with version $MODULE_SHA..."
            mkdir -p lambda/$MODULE/target
            
            aws s3 cp \
              "$BUCKET/$MODULE/$MODULE_SHA/function.zip" \
              lambda/$MODULE/target/function.zip
          done

      - name: Deploy Frontend Artifact to Frontend S3 Bucket
        run: |
          AWS_STG_ACCOUNT_ID=071308038858
          FRONTEND_MODULE="web"
          SHA=$(jq -r ".modules.\"$FRONTEND_MODULE\"" ./manifest.json)

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "❌ ERROR: No artifact version for $FRONTEND_MODULE in manifest (never built?). Aborting."
            exit 1
          fi

          ARTIFACT_S3_BUCKET="s3://apiforge-artifacts-$AWS_STG_ACCOUNT_ID"
          TARGET_BUCKET="apiforge-frontend-artifacts-$AWS_STG_ACCOUNT_ID"
                      
          aws s3 cp "$ARTIFACT_S3_BUCKET/$FRONTEND_MODULE/$SHA/frontend.zip" ./frontend-local.zip

          echo "Unzipping frontend package..."
          unzip -q frontend-local.zip -d ./frontend-dist
          
          echo "Synchronizing files with the web S3 bucket..."
          # CRITICAL: We must use --exclude "config.js" here. 
          # Because config.js is dynamically generated later by the `connect-frontend.sh` script,
          # it is missing from our local './frontend-dist' artifact. Without the exclude flag, 
          # the `--delete` parameter would wipe out the existing config.js on S3 at the start 
          # of the deployment, causing a temporary app outage until the stack deployment finishes.
          aws s3 sync "./frontend-dist/" "s3://$TARGET_BUCKET/" --delete --exclude "config.js"

      - name: Deploy to Staging
        run: just deploy-stack stg

      # we need to invalidate the CloudFront cache after deployment to make sure the new frontend version is served, otherwise users might still get the old cached version.
      - name: Invalidate CloudFront CDN Cache
        run: |
          STACK_NAME="apiforge-stg"
          
          echo "Fetching CloudFront Distribution ID from CloudFormation Outputs..."
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "❌ ERROR: Could not find CloudFrontDistributionId in Stack Outputs"
            exit 1
          fi
          
          echo "🚀 Triggering cache invalidation for Distribution: $DISTRIBUTION_ID"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          
          echo "✅ Invalidation submitted successfully. ID: $INVALIDATION_ID"
          echo "Note: It usually takes 1-3 minutes for AWS CloudFront to apply this globally."

      - name: Smoke Test
        run: |
          APID_ID=$(aws cloudformation describe-stacks \
            --stack-name "apiforge-stg" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiId'].OutputValue" \
            --output text)
            
          echo "Checking health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$APID_ID.execute-api.eu-central-1.amazonaws.com/stg/api/v1/health")
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ ERROR: Smoke Test failed - API responded with status $STATUS"
            exit 1
          fi
          echo "✅ API is healthy (200 OK)"