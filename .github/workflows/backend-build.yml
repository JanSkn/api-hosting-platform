name: Backend Build and Publish

# We only build from the canonical main state and upload an immutable,
# SHA-versioned artifact. github.sha here is the main commit, so the manifest
# in publish-main.yml will find the artifact under the same SHA.
on:
  workflow_call:
    inputs:
      module-name:
        required: true
        type: string

jobs:
  build-and-publish:
    name: Build & Publish – ${{ inputs.module-name }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-maven
      - uses: ./.github/actions/setup-just

      - name: Create Build Artifact
        run: just lambda install ${{ inputs.module-name }}

      - name: Configure AWS Staging Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::071308038858:role/GitHubActionsDeploymentRole # role name should match the one in bootstrap/template.yml
          aws-region: eu-central-1

      # Upload immutable artifact versioned by commit SHA (the main SHA).
      # This allows deploying a specific known-good version to prod even after
      # GitHub Actions artifact retention has expired, because we do manual
      # deployments after stg. The manifest in publish-main.yml then references
      # exactly this SHA.
      - name: Upload Build Artifact to S3
        run: |
          AWS_STG_ACCOUNT_ID=071308038858
          MODULE="${{ inputs.module-name }}"
          SHA="${{ github.sha }}"
          LOCAL_ZIP="lambda/$MODULE/target/function.zip"
          S3_BUCKET="s3://apiforge-artifacts-$AWS_STG_ACCOUNT_ID"

          echo "Uploading immutable artifact to S3 ($SHA)..."
          aws s3 cp "$LOCAL_ZIP" "$S3_BUCKET/$MODULE/$SHA/function.zip"
