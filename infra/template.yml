# all resources: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-template-resource-type-ref.html

# !!! when adjusting some parameters here, update the documentation (web/src/docs/documentation.md)
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend and Frontend setup for APIForge. 

# Lambda execution roles are generated by SAM from each function's `Policies:` block.
# CloudWatch Logs access is covered automatically by the AWSLambdaBasicExecutionRole
# that SAM attaches to every generated role, so no explicit logging policy is needed.

# ! Artifact S3 Bucket lies in bootstrap/template.yml.
# It needs to be bootstrapped because it is part of the CI/CD pipeline before the first deployment.

# Some resources have hardcoded custom names for easier reference in the CI/CD pipeline or for settings
# the Lambda env variables before unit/integration tests

Globals:
  Function:
    Runtime: java21
    Environment:
      # global environment variables for all lambdas, must be set in GlobalConfig.java in common-utils
      Variables:
        ENV: !Ref Environment
        SYSTEM_AWS_REGION: !Ref AwsRegion # AWS_REGION is reserved
        LOG_LEVEL: "INFO" # renaming this requires renaming in log4j2.xml as well

Parameters:
  Environment:
    Type: String
    AllowedValues: [local, testing, stg, prod]
  AwsRegion:
    Type: String
  LambdaMemory:
    Type: Number
  # those should not be set manually by the samconfig.toml but use the default value
  MaxDeploymentsPerUser:
    Type: Number
    Default: 5
  DeploymentsMetadataTableName:
    Type: String
    Default: "deployments-metadata"
  UserCodeBucketPrefix:
    Type: String
    Default: "apiforge-user-code-uploads" # must be unique worldwide
  EcrRepositoryName:
    Type: String
    Default: "user-apps"

Conditions:
  isDeployedEnvironment: !Or [ !Equals [ !Ref Environment, stg ], !Equals [ !Ref Environment, prod ] ]

Resources:
  AuthStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./nested/auth.yml

  FrontendStack:
    Type: AWS::Serverless::Application
    Condition: isDeployedEnvironment
    Properties:
      Location: ./nested/frontend.yml

  APIGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      MethodSettings: # TODO: customize for endpoint routes, for now enough
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5    # req/s
          ThrottlingBurstLimit: 10
      # as we set the gateway as proxy, it does not add any CORS headers, so we set them in Quarkus (application.properties) and let API Gateway forward them
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'"
        AllowHeaders: "'Accept,Authorization,Content-Type,X-Requested-With'"
        AllowOrigin: !If [ isDeployedEnvironment, !Sub "'https://${FrontendStack.Outputs.CloudFrontDistributionName}'", "'*'" ]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt AuthStack.Outputs.UserPoolArn

  BackendAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Fat JAR with maven shade plugin
      CodeUri: ../lambda/backend-api-lambda/target/function.zip
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Timeout: 15
      Architectures:
        - arm64
      MemorySize: !Ref LambdaMemory
      Events:
        # set health check endpoint unauthenticated
        HealthEvent:
          Type: Api
          Properties:
            Path: /api/v1/health # renaming this endpoint requires renaming in backend api health resource and smoke test as well
            Method: GET
            RestApiId: !Ref APIGateway
            Auth:
              Authorizer: NONE
        ApiGatewayEvent:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          # for CORS header in lambda responses, set by Quarkus in application.properties
          LAMBDA_ENVIRONMENT: "BACKEND_API_LAMBDA"
          ALLOWED_ORIGIN: !If [ isDeployedEnvironment, !Sub "https://${FrontendStack.Outputs.CloudFrontDistributionName}", "http://localhost:8080" ]
          COGNITO_USER_POOL_ID: !GetAtt AuthStack.Outputs.UserPoolId
          DEPLOYMENTS_METADATA_TABLE: !Ref DeploymentsMetadataTable
          MAX_DEPLOYMENTS_PER_USER: !Ref MaxDeploymentsPerUser 
          ECR_REPOSITORY_URI: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}"
          BUILD_QUEUE_URL: !Ref BuildJobQueue 
          USER_CODE_BUCKET: !Ref UserCodeBucket
          USER_CODE_BUCKET_PREFIX: !Ref UserCodeBucketPrefix
          DOCKERFILE_TEMPLATE_BUCKET: !Ref DockerfileTemplateBucket
      Policies:
        # presigned upload URLs + storing/checking/deleting user code in S3
        # (Crud = Get/Head + Put + Delete + List, all needed across the deployment lifecycle)
        - S3CrudPolicy:
            BucketName: !Ref UserCodeBucket
        # deployment metadata
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsMetadataTable
        # enqueue build jobs for the SQS dispatcher
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BuildJobQueue.QueueName
        # deleting a deployment / account: remove the user's Lambda, its ECR image and Cognito user
        - Statement:
            - Sid: DeleteUserFunction
              Effect: Allow
              Action: lambda:DeleteFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:app-*"
            - Sid: DeleteUserImage
              Effect: Allow
              Action: ecr:BatchDeleteImage
              Resource: !GetAtt EcrRepository.Arn
            - Sid: DeleteUserAccount
              Effect: Allow
              Action: cognito-idp:AdminDeleteUser
              Resource: !GetAtt AuthStack.Outputs.UserPoolArn

  DeploymentsMetadataTable:
  # not AWS::Serverless:SimpleTable for secondary key
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DeploymentsMetadataTableName
      BillingMode: PAY_PER_REQUEST 
      # renaming of userId or deploymentId requires renaming in backend api lambda data model
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: deploymentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH # Partition Key
        - AttributeName: deploymentId
          KeyType: RANGE # Sort Key
      SSESpecification:
        SSEEnabled: true

  UserCodeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub apiforge-usercode-${AWS::AccountId}
      # block any public access, only presigned URLs generated from backend api lambda
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3600

  DockerfileTemplateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub apiforge-dockerfile-templates-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BuildJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "apiforge-build-jobs.fifo"
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 90
      MessageRetentionPeriod: 604800 # 7 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BuildJobDLQ.Arn
        maxReceiveCount: 3

  BuildJobDLQ:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 604800 # 7 days

  SQSDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/sqs-dispatcher-lambda/target/function.zip
      Handler: com.hosting.dispatcher.handler.SqsDispatcherHandler::handleRequest
      Timeout: !If [ isDeployedEnvironment, 30, 120 ] # if CodeBuild startBuild takes very long, longer for local development due to polling for build completion
      MemorySize: 128 # only dispatching, not much memory needed
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt BuildJobQueue.Arn
            BatchSize: 1 # one deployment per instance
      Environment:
        Variables:
          LAMBDA_ENVIRONMENT: "SQS_DISPATCHER_LAMBDA"
          CODEBUILD_PROJECT_NAME: apiforge-user-code-builder # must match the name defined in the CodeBuildResource
          USER_CODE_BUCKET: !Ref UserCodeBucket
          USER_CODE_BUCKET_PREFIX: !Ref UserCodeBucketPrefix # for generating presigned URLs for user code uploads
          DOCKERFILE_TEMPLATE_BUCKET: !Ref DockerfileTemplateBucket
          ECR_REPOSITORY_URI: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}"
          DEPLOYMENTS_METADATA_TABLE: !Ref DeploymentsMetadataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsMetadataTable
        - Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt CodeBuild.Arn

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildDockerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # write logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              # read code from S3
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${UserCodeBucket}/*"
              # read docker templates from S3
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${DockerfileTemplateBucket}/*"
              # ECR login & push
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn

  CodeBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      # custom name to avoid circular dependencies
      Name: "apiforge-user-code-builder" # if name changed, change as well other calls
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        # architecture should match the architecture in UserLambdaConfig
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/amazonlinux-aarch64-standard:2.0"
        PrivilegedMode: true # required for Docker builds          
      Source: # override in CodeBuildRepository to specific user code, but mandatory field
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Placeholder buildspec. Overridden during invocation."
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaServiceToPullImages
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:app-*"
      # max. deployments per user handled in backend-api-lambda
      LifecyclePolicy:
        # rule would only apply if updated image with same tag
        # --> old gets untagged
        # (only if user can update a deployment)
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Delete ghost images without tag after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Execution role assigned to every user-deployed Lambda (app-*). The function-deployer
  # hardcodes this exact role name (LambdaDeploymentRepository.java: role/UserFunctionRole).
  # Intentionally minimal: untrusted user code only gets CloudWatch Logs access.
  #
  # Log retention/cleanup for these functions is handled by the function-deployer at runtime
  # (LambdaDeploymentRepository): it pre-creates each /aws/lambda/app-* log group with a short
  # retention and deletes it on teardown. The retention permissions live on the FunctionDeployer
  # role below (ManageUserFunctionLogGroups), not here.
  UserFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UserFunctionRole # name is hardcoded in LambdaDeploymentRepository.java
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FunctionDeployer:
  # triggered by EventBridge event after codebuild uploaded to ECR to deploy user's lambda with the image
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/function-deployer-lambda/target/function.zip
      Handler: com.hosting.deployer.handler.FunctionDeployerHandler::handleRequest
      Timeout: 30 # if deployment takes very long
      MemorySize: 128 # only creation, not much memory needed
      Events:
        DeploymentEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - "aws.codebuild"
              detail-type:
                - "CodeBuild Build State Change"
              detail:
                build-status:
                  - "SUCCEEDED"
                project-name: # project name must be passed via environment variable in SQS dispatcher and match the one in CodeBuild resource
                  - apiforge-user-code-builder # must match the name defined in the CodeBuild Resource
      Environment:
        Variables:
            LAMBDA_ENVIRONMENT: "FUNCTION_DEPLOYER_LAMBDA"
            ECR_REPOSITORY_URI: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}"
            DEPLOYMENTS_METADATA_TABLE: !Ref DeploymentsMetadataTable
      Policies:
        # create the user's Lambda from the ECR image and expose it via a public Function URL
        - Statement:
            - Sid: CreateUserFunction
              Effect: Allow
              Action:
                - lambda:CreateFunction
                - lambda:GetFunction
                - lambda:UpdateFunctionCode
                - lambda:CreateFunctionUrlConfig
                - lambda:AddPermission
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:app-*"
        # allow handing the user-function execution role to the Lambda service on CreateFunction
        - Statement:
            - Sid: PassUserFunctionRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt UserFunctionRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: lambda.amazonaws.com
        # manage the log groups of user functions: pre-create them with a short retention and
        # delete them on teardown so user logs don't accrue CloudWatch storage cost forever
        - Statement:
            - Sid: ManageUserFunctionLogGroups
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:DeleteLogGroup
                - logs:PutRetentionPolicy
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/app-*"
        # update deployment metadata (status, API URI)
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsMetadataTable

  BackendAPILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # name must be same as Lambda function name to control default log created by lambda
      LogGroupName: !Sub "/aws/lambda/${BackendAPIFunction}" 
      RetentionInDays: 7

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "/aws/codebuild/apiforge-user-code-builder"
      RetentionInDays: 7

  SQSDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # name must be same as Lambda function name to control default log created by lambda
      LogGroupName: !Sub "/aws/lambda/${SQSDispatcherFunction}" 
      RetentionInDays: 7

  FunctionDeployerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # name must be same as Lambda function name to control default log created by lambda
      LogGroupName: !Sub "/aws/lambda/${FunctionDeployer}" 
      RetentionInDays: 7

# changing the output names requires renaming in connect-frontend.sh
Outputs:
  Region:
    Description: "AWS Region of the stack"
    Value: !Ref "AWS::Region"

  ApiId:
    Description: "API ID"
    Value: !Ref APIGateway
  
  UserPoolId:
    Description: "UserPool ID"
    Value: !GetAtt AuthStack.Outputs.UserPoolId
  
  UserPoolClientId:
    Description: "UserPoolClient ID"
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId

  DockerfileTemplateBucket:
    Description: "Bucket containing Dockerfile templates"
    Value: !Ref DockerfileTemplateBucket

  WebBucketName:
    Description: "Name of the S3 bucket for frontend artifacts"
    Condition: isDeployedEnvironment
    Value: !GetAtt FrontendStack.Outputs.WebBucketName

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID for the frontend"
    Condition: isDeployedEnvironment
    Value: !GetAtt FrontendStack.Outputs.CloudFrontDistributionId

  CloudFrontDistributionName:
    Description: "CloudFront domain name of the frontend (used as the e2e base URL)"
    Condition: isDeployedEnvironment
    Value: !GetAtt FrontendStack.Outputs.CloudFrontDistributionName